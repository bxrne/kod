name: release

# Conventional commits on main drive everything: commitizen bumps the
# version by a patch, writes the changelog, and tags. Tags build the
# release binaries.
on:
  push:
    branches: [main]

# One push at a time. Two bumps racing on the same version would tag
# the same release twice.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build test

  bump:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install commitizen
      - id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Patch only. A `feat:` commit must never jump the minor
          # line: the project stays inside 0.0.0 to 0.1.x.
          if cz bump --yes --changelog --increment PATCH; then
            # The tag follows the package version, and it is pushed by
            # name. `--follow-tags` dropped it before, so the release
            # job had no ref and no release was made.
            ver=$(sed -n 's/.*\.version = "\([^"]*\)".*/\1/p' build.zig.zon | head -1)
            if [ -z "$ver" ]; then
              echo "no version in build.zig.zon" >&2
              exit 1
            fi
            git tag -a "v$ver" -m "v$ver"
            git push origin main
            git push origin "v$ver"
            echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          else
            # No conventional commit since the last tag: nothing to release.
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: bump
    if: needs.bump.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            os: ubuntu-latest
          - target: x86_64-macos
            os: macos-latest
          - target: aarch64-macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
      - run: zig build test -Dtarget=${{ matrix.target }}
      - run: tar -czf kod-${{ needs.bump.outputs.tag }}-${{ matrix.target }}.tar.gz -C zig-out/bin kod
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump.outputs.tag }}
          name: kod ${{ needs.bump.outputs.tag }}
          generate_release_notes: true
          files: kod-${{ needs.bump.outputs.tag }}-${{ matrix.target }}.tar.gz
